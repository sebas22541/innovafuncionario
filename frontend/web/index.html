<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplicacion web con menu base y lector QR.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QR Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QR Web</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Reduce browser/password-manager overlays on Flutter Web text inputs.
    // Chrome may still show security warnings it owns, but these attributes
    // keep app fields from advertising saved-account/autofill behavior.
    (function () {
      function hardenInput(element) {
        if (!element || !element.setAttribute) {
          return;
        }

        element.setAttribute('autocomplete', 'off');
        element.setAttribute('autocorrect', 'off');
        element.setAttribute('autocapitalize', 'off');
        element.setAttribute('spellcheck', 'false');
        element.setAttribute('data-lpignore', 'true');
        element.setAttribute('data-1p-ignore', 'true');
        element.setAttribute('data-bwignore', 'true');
      }

      function hardenAutofillTargets(root) {
        var scope = root && root.querySelectorAll ? root : document;
        scope.querySelectorAll('input, textarea, form').forEach(hardenInput);
      }

      window.addEventListener('DOMContentLoaded', function () {
        hardenAutofillTargets(document);

        new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (node.nodeType !== Node.ELEMENT_NODE) {
                return;
              }

              hardenInput(node);
              hardenAutofillTargets(node);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
