services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistenciasQR
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/La_Paz
    volumes:
      - qr_postgres_local_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistenciasQR"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qr_postgres_local_data:
